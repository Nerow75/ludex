[package]
name = "ludex"
version = "0.2.0"
description = "Ludex : tous tes jeux, un seul launcher"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ludex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
ureq = "2"
notify = "8.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde_yaml_ng = "0.10"
glob = "0.3"
dirs = "6"
time = { version = "0.3", features = ["local-offset"] }
tauri-plugin-global-shortcut = "2"
# Export et import des données perso (`transfer.rs`) : sans aucune fonction, méthode « stockée »
# seulement. Déjà dans l'arbre avec ces mêmes fonctions par `tauri-plugin-updater`.
zip = { version = "9", default-features = false }

[features]
# Affichage forcé de l'écran de premier lancement par `LUDEX_WELCOME=1` dans une build de release
# (vérification à l'écran). Jamais dans une build publiée ; en debug, la variable suffit.
welcome-preview = []
# Essai des notifications Windows dans une build de release : `LUDEX_NOTIFY_PREVIEW=1` envoie,
# 15 s après le premier scan, la notification de fin de téléchargement du premier jeu Steam puis
# celle d'un disque presque plein (règles habituelles : fenêtre sans le focus). Jamais publiée.
notify-preview = []

[target.'cfg(windows)'.dependencies]
pelite = "0.10"
winreg = "0.55"
# Jump List de la barre des tâches (`jumplist.rs`) : déjà dans l'arbre des dépendances par Tauri.
# Cartes graphiques, niveau DirectX et mémoire installée (`requirements.rs`) : DXGI, Direct3D 11,
# SystemInformation. Notifications Windows (`notify.rs`) : toasts WinRT et leur clic.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
